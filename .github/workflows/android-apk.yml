# Build an installable Android APK on free CI, in either of two shapes.
#
# Why this exists: EAS Build needs an Expo login, and a local Gradle build needs
# a JDK plus ~3GB of Android SDK. GitHub's ubuntu runners already ship both, and
# the free minutes cover far more builds than this project will ever need — so
# this produces a shareable APK with no account and nothing to install locally.
#
# TWO VARIANTS, and the difference matters more than it looks:
#
#   release  A standalone app. The JS is bundled INTO the APK at build time, so
#            every JS change needs another 20-40 minute run. This is what you
#            send to testers.
#
#   debug    A development client. It contains no JS: it loads the bundle from
#            Metro over the adb reverse tunnels at launch, so once it is
#            installed, every JS change hot-reloads with NO further native
#            build. This is the one to install on the S23 while building, and
#            it only needs rebuilding when a NATIVE dependency changes.
#
# Because the debug variant carries no bundle, it also carries no EXPO_PUBLIC_*
# values — those are inlined by Metro at bundle time, from apps/mobile/.env on
# the dev machine. So the env step below runs for `release` only, and a debug
# build correctly picks up whatever the laptop is pointing at, including a local
# API on localhost:4000.
#
# Signing: `expo prebuild` generates the standard Android debug keystore, and
# Expo's template signs `release` with it. That is what makes an unsigned-secret
# build possible at all. The catch is real and worth knowing: the keystore is
# regenerated every run, so each APK has a DIFFERENT signature and Android will
# refuse to install one over another. Testers must uninstall first. That is fine
# for a closed beta and NOT fine for the Play Store, which needs a stable upload
# key — see the note at the bottom of this file.
#
# The release client env comes from eas.json's `preview` profile so there is one
# source of truth. Those three values are all public client-side config (the
# Supabase anon key is designed to ship inside apps); nothing secret is read here.

name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "release = standalone APK for testers · debug = dev client that loads JS from Metro"
        type: choice
        default: release
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

concurrency:
  group: android-apk-${{ github.ref }}-${{ inputs.variant || 'release' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # A tag push is always a tester build; only a manual run can ask for debug.
      VARIANT: ${{ inputs.variant || 'release' }}

    steps:
      # ubuntu-latest ships ~14GB free, and this build does not fit in it: RN
      # 0.81 with the new architecture compiles C++ per ABI, on top of the SDK,
      # Gradle caches and a hoisted node_modules. The first run died with
      # "No space left on device" while writing its own diagnostic log.
      #
      # These are preinstalled toolchains this build never touches. The Android
      # SDK at /usr/local/lib/android is deliberately NOT removed — Gradle needs
      # it, and deleting it would trade one failure for another.
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - name: Name the variant
        id: v
        run: |
          # Gradle wants the task capitalised (assembleRelease / assembleDebug).
          printf 'task=%s\n' "$(echo "$VARIANT" | sed 's/^./\U&/')" >> "$GITHUB_OUTPUT"
          echo "Building the **$VARIANT** variant." >> "$GITHUB_STEP_SUMMARY"

      - name: Read client env from eas.json
        id: env
        # Release only. A debug build embeds no JS bundle, so there is nothing
        # for these to be inlined into — Metro supplies them at runtime instead.
        if: env.VARIANT == 'release'
        working-directory: apps/mobile
        run: |
          node -e '
            const p = require("./eas.json").build.preview.env || {};
            const need = ["EXPO_PUBLIC_SUPABASE_URL","EXPO_PUBLIC_SUPABASE_ANON_KEY","EXPO_PUBLIC_API_URL"];
            const missing = need.filter((k) => !p[k]);
            if (missing.length) {
              console.error("::error::eas.json preview profile is missing: " + missing.join(", "));
              process.exit(1);
            }
            // Masked in the log even though these are public values — a build log
            // is not the place to print configuration wholesale.
            for (const k of need) console.log(`::add-mask::${p[k]}`);
            const fs = require("fs");
            for (const k of need) fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${p[k]}\n`);
            // Optional client config. Absent is a valid configuration for every
            // one of these, so a missing key must never fail the build — the app
            // is written to behave correctly without them.
            const optional = ["EXPO_PUBLIC_CLINIC_BOOKING_URL"];
            for (const k of optional) {
              if (!p[k]) continue;
              console.log(`::add-mask::${p[k]}`);
              fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${p[k]}\n`);
            }
          '
          echo "client env loaded from eas.json preview profile"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile so CI can never silently resolve a different version
        # than the machine that committed the lockfile. The SDK pins in this repo
        # are load-bearing: drifting expo past the native build breaks the app.
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the native project
        working-directory: apps/mobile
        # --no-install because pnpm already did it, and letting prebuild run its
        # own install would use npm and break the hoisted layout autolinking needs.
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
          # React Native builds four ABIs by default, each a full compile of
          # every native module. That is most of the disk and most of the time,
          # and three of them are for hardware nobody here is running.
          #
          # debug   arm64-v8a only — the S23, and every phone made this decade.
          # release adds armeabi-v7a so an older tester device still installs.
          # Neither ships x86/x86_64: those are emulator ABIs, and an emulator
          # can run Metro directly without this APK.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: >-
            ${{ inputs.variant == 'debug' && 'arm64-v8a' || 'arm64-v8a,armeabi-v7a' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assemble${{ steps.v.outputs.task }} --no-daemon --stacktrace

      - name: Locate the APK
        id: apk
        run: |
          path=$(find apps/mobile/android -name "*.apk" -path "*$VARIANT*" | head -1)
          if [ -z "$path" ]; then
            echo "::error::Gradle finished but no $VARIANT APK was produced"
            find apps/mobile/android -name "*.apk" || true
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Built: $path ($(du -h "$path" | cut -f1))"
          echo "disk after build:"; df -h / | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: biosync-apk-${{ env.VARIANT }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: How to install
        run: |
          {
            echo "### BIOSYNC APK built ($VARIANT)"
            echo ""
            echo "Download **biosync-apk-$VARIANT** from the Artifacts section of this run,"
            echo "then \`adb install -r <file>.apk\`."
            echo ""
            echo "**Uninstall any previous BIOSYNC build first.** Each run generates a fresh"
            echo "debug keystore, so signatures differ between builds and Android refuses"
            echo "to install over the top."
            echo ""
            if [ "$VARIANT" = "debug" ]; then
              echo "This is a **development client** — it has no JS inside it and will not"
              echo "start without Metro. To run it:"
              echo ""
              echo '```'
              echo "adb reverse tcp:8081 tcp:8081 && adb reverse tcp:4000 tcp:4000"
              echo "pnpm --filter @pulse/api dev"
              echo 'REACT_NATIVE_PACKAGER_HOSTNAME=localhost pnpm --filter mobile start -c'
              echo 'adb shell am start -a android.intent.action.VIEW \'
              echo '  -d "pulse://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"'
              echo '```'
              echo ""
              echo "After this, **JS changes hot-reload** — you only need another native"
              echo "build when a native dependency changes."
            else
              echo "This is a **standalone build**: the JS is baked in, so it runs with no"
              echo "Metro and talks to the API URL from eas.json's preview profile."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# Play Store, later:
#   A store build needs a STABLE upload key, not a per-run debug keystore.
#   Generate one once (`keytool -genkeypair -v -keystore upload.jks -alias upload
#   -keyalg RSA -keysize 2048 -validity 10000`), base64 it into a repository
#   secret, decode it in a step here, and point a `release` signingConfig at it.
#   Enrol in Play App Signing so Google holds the real app-signing key and this
#   one only signs uploads — then losing it is recoverable.
