# Keep the free-tier stack from going to sleep.
#
# Two different problems, two different pings:
#
#   * Render's free instance spins down after ~15 minutes idle and the next
#     request pays a cold start. `/health` never touches Postgres, so pinging
#     it often is cheap.
#   * Supabase's free project pauses after ~7 days with no DATABASE activity —
#     which the health ping does NOT prevent, because it never queries. So a
#     separate, much rarer ping hits `/health/db`, whose only job is to make
#     the project count as active.
#
# Every 10 minutes would exceed the free Actions minutes on a private repo
# (each run bills a whole minute, so 6/hour ≈ 4,300 minutes/month against a
# 2,000 allowance). Every 30 minutes fits, and covers the case that actually
# matters: the app being slow for whoever opens it first.
#
# This is a stopgap, not a fix. It is here so a free tier can carry a closed
# beta without the app looking broken every morning. Real users on paid tiers
# make it unnecessary — delete it then.

name: Keep awake

on:
  schedule:
    - cron: "*/30 * * * *"   # API: every 30 minutes
    - cron: "17 4 * * *"     # database: once daily, off-peak
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
            https://biosync-api.onrender.com/health || echo "000")
          echo "GET /health -> $code"
          # A cold start is slow, not broken, so a timeout must not fail the
          # job and start mailing failure notices every half hour.
          if [ "$code" != "200" ]; then
            echo "::warning::API did not answer 200 (got $code) — likely a slow cold start"
          fi

      - name: Touch the database
        if: github.event.schedule == '17 4 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
            https://biosync-api.onrender.com/health/db || echo "000")
          echo "GET /health/db -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Database ping did not answer 200 (got $code) — check whether the Supabase project has paused"
          fi
